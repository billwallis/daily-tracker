# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-tracker"
version = "0.0.0"
description = "An application for keeping track of tasks throughout the day."
authors = [{name = "billwallis"}]
maintainers = [{name = "billwallis"}]
readme = "README.md"
urls.Homepage = "https://github.com/billwallis/daily-tracker"
urls.Repository = "https://github.com/billwallis/daily-tracker"
urls.Issues = "https://github.com/billwallis/daily-tracker/issues"
urls.Documentation = "https://github.com/billwallis/daily-tracker/blob/main/README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"  # Capped by `pywin32`
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cachetools>=6.2.6",
    "duckdb>=1.4.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "streamlit>=1.54.0",
    "ttkthemes>=3.3.0",
    "wakepy>=1.0.0",
]
scripts.daily-tracker = "daily_tracker.cli:main"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.16.0",
    "pytest>=9.1.1",
]
# integrations
google-calendar = [
    "google-api-python-client>=2.190.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
]
outlook = [
    "pywin32==311; sys_platform == 'win32'",
    "appscript==1.2.2; sys_platform == 'darwin'",
]
slack = [
    "slack-sdk>=3.40.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage]
run.source = ["src", "tests"]
run.plugins = ["covdefaults"]  # https://youtu.be/70T6OxKwxm0
report.fail_under = 10
report.exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
]


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install \
        --editable . \
        --requirement requirements.txt \
        --group dev \
        --group test \
        --group google-calendar \
        --group outlook \
        --group slack \
        --force-reinstall
    pre-commit install --install-hooks
"""
test.shell = """
    coverage erase
    coverage run -m pytest -vvv
    coverage xml --quiet
    coverage report --no-skip-covered --include 'tests/*' --fail-under 100
    coverage report --no-skip-covered --include 'src/*'
"""

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""
